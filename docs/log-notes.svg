<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="A log note named Log - productivity with a day of reading: started reading, took a break, resumed, lunch break. Each line starts with the time it was written, in grey, followed by the entry in black.">
  <style>
    .card { fill: #ffffff; stroke: #e2e2e7; }
    .title { fill: #1d1d1f; font: 600 24px -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
    .rule { stroke: #e2e2e7; }
    .row { font: 400 17px ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; white-space: pre; }
    .time { fill: #8a8a8e; }
    .faint { fill: #cfcfd4; }
    .text { fill: #1d1d1f; }
    .cursor { fill: #0a84ff; font-weight: 300; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e1e20; stroke: #3a3a3e; }
      .title { fill: #f5f5f7; }
      .rule { stroke: #3a3a3e; }
      .time { fill: #98989d; }
      .faint { fill: #4a4a4e; }
      .text { fill: #f5f5f7; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="879" height="439" rx="16"/>
  <text class="title" x="32" y="52">Log - productivity</text>
  <line class="rule" x1="0" y1="76" x2="880" y2="76"/>
  <g class="row">
    <text x="32" y="122"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">09:08:14</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> started reading: DDIA, chapter 4</tspan></text>
    <text x="32" y="162"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">09:52:40</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> took a break, tea and a walk</tspan></text>
    <text x="32" y="202"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">10:07:05</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> resume reading: Avro schema changes</tspan></text>
    <text x="32" y="242"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">11:26:31</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> finished ch. 4, wrote down 5 key points</tspan></text>
    <text x="32" y="282"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">11:41:12</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> replied to Neil about the deck</tspan></text>
    <text x="32" y="322"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">12:34:48</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> lunch break</tspan></text>
    <text x="32" y="362"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">13:21:09</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> back from lunch, reread yesterday's notes</tspan></text>
    <text x="32" y="402"><tspan class="time">2026-11-05</tspan><tspan class="faint">T</tspan><tspan class="time">13:40:02</tspan><tspan class="faint">+05:30</tspan><tspan class="text"> </tspan><tspan class="cursor">|</tspan></text>
  </g>
</svg>
