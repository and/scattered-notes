name: ScatteredNotesiOS
options:
  bundleIdPrefix: com.scatterednotes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: RLVYQT69D4
  CODE_SIGN_STYLE: Automatic

targets:
  ScatteredNotesiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # Notes, the agenda and storage are shared with the Mac app; FSEvents does not exist on iOS
      - path: ../Sources/Models
        group: Shared
      - path: ../Sources/Storage
        group: Shared
        excludes:
          - FolderWatcher.swift
    entitlements:
      path: Sources/ScatteredNotesiOS.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.scatterednotes]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.scatterednotes]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Scattered Notes"
        # Same version as the Mac app
        CFBundleShortVersionString: "1.1.4"
        CFBundleVersion: "7"
        # Uses only the encryption built into iOS, so TestFlight and the App Store need no export paperwork
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets the default notes folder show up in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The app's own folder in iCloud Drive, shared with the Mac app
        NSUbiquitousContainers:
          iCloud.com.scatterednotes:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "Scattered Notes"
            NSUbiquitousContainerSupportedFolderLevels: Any
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.ios
      # Same module name as the Mac app, so the shared tests' `@testable import ScatteredNotes` works
      PRODUCT_MODULE_NAME: ScatteredNotes
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: "NO"

  ScatteredNotesiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/ScatteredNotesTests/AgendaTests.swift
      - path: ../Tests/ScatteredNotesTests/NoteSearchTests.swift
    dependencies:
      - target: ScatteredNotesiOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.ios.tests
      GENERATE_INFOPLIST_FILE: "YES"
