name: ScatteredNotesiOS
options:
  bundleIdPrefix: com.scatterednotes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: RLVYQT69D4
  CODE_SIGN_STYLE: Automatic

targets:
  ScatteredNotesiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # Notes, the agenda and storage are shared with the Mac app; FSEvents does not exist on iOS
      - path: ../Sources/Models
        group: Shared
      - path: ../Sources/Storage
        group: Shared
        excludes:
          - FolderWatcher.swift
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Scattered Notes"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets the default notes folder show up in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.ios
      # Same module name as the Mac app, so the shared tests' `@testable import ScatteredNotes` works
      PRODUCT_MODULE_NAME: ScatteredNotes
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: "NO"

  ScatteredNotesiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/ScatteredNotesTests/AgendaTests.swift
      - path: ../Tests/ScatteredNotesTests/NoteSearchTests.swift
    dependencies:
      - target: ScatteredNotesiOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.ios.tests
      GENERATE_INFOPLIST_FILE: "YES"
