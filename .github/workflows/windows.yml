name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --configuration Release
      - name: Publish x64 and arm64
        run: |
          dotnet publish src/ScatteredNotes.App -c Release -r win-x64 -o artifacts/win-x64
          dotnet publish src/ScatteredNotes.App -c Release -r win-arm64 -o artifacts/win-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ScatteredNotes-windows
          path: windows/artifacts/
