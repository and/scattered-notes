name: ScatteredNotes
options:
  bundleIdPrefix: com.scatterednotes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  ENABLE_HARDENED_RUNTIME: "NO"
  GENERATE_INFOPLIST_FILE: "YES"

targets:
  ScatteredNotes:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: "Scattered Notes"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "11"
        CFBundleIconFile: "AppIcon"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # The app's own folder in iCloud Drive, shared with the iPhone and iPad app. The iCloud
        # entitlement is added only when signing a release (scripts/release.sh)
        NSUbiquitousContainers:
          iCloud.com.scatterednotes:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "Scattered Notes"
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.app
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
      configs:
        # Debug builds, including the ones tests run, keep their own settings and never touch
        # those of the installed app
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.app.debug

  ScatteredNotesTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ScatteredNotesTests
    dependencies:
      - target: ScatteredNotes
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.app.tests
      GENERATE_INFOPLIST_FILE: "YES"

  ScatteredNotesUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: UITests
    dependencies:
      - target: ScatteredNotes
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.scatterednotes.app.uitests
      GENERATE_INFOPLIST_FILE: "YES"
      TEST_TARGET_NAME: ScatteredNotes
      # XCUIApplication is main-actor-only under Swift 6, which XCTest's set-up methods can't be
      SWIFT_VERSION: "5.0"

schemes:
  ScatteredNotes:
    build:
      targets:
        ScatteredNotes: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScatteredNotesTests
    archive:
      config: Release
  ScatteredNotesUITests:
    build:
      targets:
        ScatteredNotes: all
        ScatteredNotesUITests: [test]
    test:
      config: Debug
      targets:
        - ScatteredNotesUITests
